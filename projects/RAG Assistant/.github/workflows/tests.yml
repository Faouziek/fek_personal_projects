name: Tests Windows et Linux
on: [push, pull_request, workflow_dispatch]
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen rag download
      - run: uv run --frozen python -m pytest -q
  retrieval:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen rag download
      - run: uv run --frozen rag index
      - run: uv run --frozen rag evaluate
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-report
          path: artifacts/evaluation.json
