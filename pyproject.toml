[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-python-local"
version = "0.1.0"
description = "PDF RAG with Sentence Transformers, FAISS and Ollama, on Windows and Linux"
requires-python = ">=3.11,<3.13"
dependencies = [
  "sentence-transformers>=3.4,<6",
  "faiss-cpu>=1.10,<2",
  "pymupdf>=1.25,<2",
  "httpx>=0.28,<1",
  "numpy>=1.26,<3",
  "torch>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
rag = "rag_python.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'", "sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
